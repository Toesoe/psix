<div class="brand">
  <span class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="4.5"/>
      <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
    </svg>
  </span>
  <span class="brand-name">psix</span>
</div>

<div class="device-pill {{ 'is-connected' if status.connected else 'is-offline' }}">
  <span class="device-dot"></span>
  {% if status.connected and status.mock_mode %}
    <span class="device-product">Mock</span>
  {% elif status.connected and status.info %}
    <span class="device-product">{{ status.info.product }}</span>
    <span class="device-meta">{{ status.info.serial_picl or '—' }}</span>
  {% else %}
    <span class="device-product">{{ status.message or 'No scanner' }}</span>
    {% if status.error %}<span class="device-meta device-error" title="{{ status.error }}">error</span>{% endif %}
  {% endif %}
</div>

<div class="topbar-actions">
  <button type="button" class="btn btn-ghost" data-action="connect" title="Connect / refresh scanner">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M16 4v4h-4"/>
      <path d="M16 8a6 6 0 1 0-1.6 5"/>
    </svg>
    <span>Connect</span>
  </button>
</div>
