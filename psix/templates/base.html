<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>psix{% block title %}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body data-view="{{ view }}">

  <header class="topbar">
    {% include 'partials/topbar.html' %}
  </header>

  <div class="shell">
    <aside class="sidebar">
      <nav>
        <a href="{{ url_for('scan_page') }}" class="nav-item {{ 'is-active' if view == 'scan' }}">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2.5" y="4" width="15" height="12" rx="1.5"/>
              <path d="M2.5 7h15M2.5 13h15M6 4v12M14 4v12"/>
            </svg>
          </span>
          <span>Scan</span>
        </a>
        <a href="{{ url_for('settings_page') }}" class="nav-item {{ 'is-active' if view == 'settings' }}">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="10" cy="10" r="2.5"/>
              <path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4"/>
            </svg>
          </span>
          <span>Settings</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="sidebar-foot-row">
          <span class="sidebar-foot-label">Scanner</span>
          <span class="sidebar-foot-value">{{ status.display or '—' }}</span>
        </div>
        {% if storage %}
          <div class="sidebar-foot-row disk-{{ storage.level }}">
            <span class="sidebar-foot-label">Disk free</span>
            <span class="sidebar-foot-value">{{ storage.disk_free_label }} / {{ storage.disk_total_label }}</span>
          </div>
        {% endif %}
      </div>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
